services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:version-10.3_p1-r0
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      USER_NAME: codex
      USER_PASSWORD: codex-test-password
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
      PUBLIC_KEY: ${SCC_SSH_PUBLIC_KEY}
      LOG_STDOUT: "true"
    ports:
      - "2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /config
