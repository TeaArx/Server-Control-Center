name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag and get version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag must have the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
          }

          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ServerControlCenter.csproj --runtime win-x64

      - name: Publish self-contained application
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish ServerControlCenter.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            -p:FileVersion=$env:VERSION `
            -p:AssemblyVersion=$env:VERSION

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: iscc "/DMyAppVersion=$env:VERSION" installer/ServerControlCenter.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Server Control Center ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/installer/Server-Control-Center-Setup-${{ steps.version.outputs.version }}.exe
